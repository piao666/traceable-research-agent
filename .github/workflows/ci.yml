name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lightweight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OFFLINE_MODE: "true"
      EXTERNAL_TOOLS_DEFAULT_MODE: mock
      GITHUB_TOOL_DEFAULT_MODE: mock
      LLM_PLANNER_ENABLED: "false"
      LLM_PROVIDER: deterministic
      REPORT_GENERATION_MODE: deterministic
      MCP_REMOTE_REGISTRY_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --prefer-binary --retries 5 --resume-retries 10 --timeout 120 -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall app scripts frontend migrations tests

      - name: Run offline unit contracts
        run: python scripts/run_offline_tests.py --runner pytest

      - name: Live isolated API and persistence smoke
        run: python scripts/smoke_research_integrity.py


      - name: Run quality evaluation (mock)
        run: python scripts/run_quality_eval.py --mode mock --dataset all
        env:
          OFFLINE_MODE: "true"
          EXTERNAL_TOOLS_DEFAULT_MODE: mock
          GITHUB_TOOL_DEFAULT_MODE: mock
          LLM_PLANNER_ENABLED: "false"
          LLM_PROVIDER: deterministic
          REPORT_GENERATION_MODE: deterministic
          MCP_REMOTE_REGISTRY_ENABLED: "false"

      - name: Run representative smoke checks
        run: |
          python scripts/smoke_docker_config.py
          python scripts/smoke_planner.py
          python scripts/smoke_mcp_server.py
          python scripts/smoke_streamlit_frontend.py
          python scripts/smoke_provenance_v2.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned frontend and API dependencies
        run: |
          npm ci --prefix web --no-audit --no-fund
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements/api.txt
      - name: Verify generated OpenAPI types
        working-directory: web
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Frontend gates
        working-directory: web
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          node qa/smoke.mjs
